<?xml version="1.0" encoding="UTF-8"?>
<!-- Turni apple-touch-icon (iOS) — Source-of-truth (STORY-041 / IDR-020 §8).
     DIFERENTE do icon.svg de propósito: o iOS aplica a PRÓPRIA máscara (squircle) e compõe
     qualquer transparência sobre PRETO. Por isso este ícone é QUADRADO, 100% OPACO e
     SEM cantos arredondados — fundo brandGreen (#00A868) cobre 100% do canvas. "T" branco
     no tamanho cheio (mesmo path do icon.svg). Regerar PNG: npm run icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#00A868"/>
  <path d="M126 104 H386 V168 H290 V416 H222 V168 H126 Z" fill="#FFFFFF"/>
</svg>
