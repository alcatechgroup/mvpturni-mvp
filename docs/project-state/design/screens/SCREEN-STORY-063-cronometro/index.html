<!DOCTYPE html>
<!--
  PROTÓTIPO DE VALIDAÇÃO — NÃO É CÓDIGO DE PRODUÇÃO.
  SCREEN-STORY-063 — Cronômetro bilateral vivo (ADR-017: âncora + tick local + polling).
  HTML/CSS/JS vanilla, sem rede, sem build. Abra clicando no arquivo.
  Tokens reais dos dois temas (DDR-001); locale pt-BR / 24h (DDR-002).
  Microcopy = §5 do spec, palavra por palavra. data-testid = §7.
  Base visual herdada dos protótipos da SCREEN-060/061/062 (mesmo detalhe do turno).
  O tick é REAL (1s, derivado de uma âncora fixa — espelha o mecanismo da ADR-017).
  Modo "bilateral" mostra os dois papéis lado a lado ancorados no MESMO iniciado_em.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCREEN-STORY-063 — Cronômetro bilateral</title>
<style>
  :root {
    --page: #F7F4EC; --surface: #FFFFFF;
    --border-subtle: #E0DDD3; --border-strong: #C8C5BB;
    --text-strong: #0F1B2D; --text-muted: #42504A;
    --brand: #00A868;
    --error: #B83A3A; --error-soft: #FBE2E2;
    --warn-ink: #6E4E12; --warn-soft: #FBEED1; --warn-border: #DCB96A;
    --success: #2D7A4F; --success-soft: #E2F0E5; --success-border: #9cc7ad;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-full: 999px;
    --s-xs: 4px; --s-sm: 8px; --s-md: 16px; --s-lg: 24px; --s-xl: 32px;
  }
  .papel-profissional { --accent: #2D5F3F; --accent-ink: #2D5F3F; --on-accent: #FFFFFF; }
  .papel-contratante  { --accent: #9A6E25; --accent-ink: #6E4E12; --on-accent: #FFFFFF; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: #EAE6DA; color: var(--text-strong);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .proto-bar {
    position: sticky; top: 0; z-index: 50; background: #3D2A0E; color: #ECEDE5;
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    font-size: 13px;
  }
  .proto-bar strong { color: #fff; }
  .proto-bar .chip {
    border: 1px solid #5a452a; background: #2e2310; color: #e7ddc9;
    border-radius: var(--r-full); padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  .proto-bar .chip.active { background: #00A868; color: #fff; border-color: #00A868; }
  .proto-bar .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .proto-bar .sep { width: 1px; height: 20px; background: #5a452a; }

  .stage { display: flex; justify-content: center; gap: 24px; padding: 28px 16px 60px; flex-wrap: wrap; }
  .frame {
    background: var(--page); width: 100%; max-width: 412px;
    min-height: 720px; border-radius: var(--r-lg);
    box-shadow: 0 8px 30px rgba(0,0,0,.18); overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  body.desktop .frame { max-width: 980px; }
  body.bilateral .frame { max-width: 412px; }
  .frame-rotulo {
    display: none; text-align: center; font-size: 12px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted);
    padding: 10px 0 0;
  }
  body.bilateral .frame-rotulo { display: block; }

  .appbar {
    display: flex; align-items: center; gap: var(--s-sm);
    padding: 10px var(--s-sm) 10px var(--s-xs); background: var(--surface);
    border-bottom: 1px solid var(--border-subtle);
  }
  .appbar .back {
    background: none; border: none; cursor: pointer; font-size: 20px;
    min-width: 48px; min-height: 48px; border-radius: var(--r-full);
    display: inline-flex; align-items: center; justify-content: center; color: var(--text-strong);
  }
  .appbar .title { font-size: 18px; font-weight: 700; flex: 1; }
  body.desktop:not(.bilateral) .appbar { display: none; }

  .brand {
    font-family: "Bebas Neue", Impact, "Arial Narrow Bold", sans-serif;
    color: var(--brand); font-size: 30px; letter-spacing: 1px; text-align: center;
    padding: 10px 0 0; display: none;
  }
  body.desktop:not(.bilateral) .brand { display: block; }

  .header-row { display: none; }
  body.desktop:not(.bilateral) .header-row {
    display: flex; align-items: center; gap: var(--s-sm); margin-bottom: var(--s-md);
  }
  body.desktop:not(.bilateral) .header-row .back { background:none; border:none; cursor:pointer; font-size:20px;
    min-width:44px; min-height:44px; border-radius: var(--r-full); }
  body.desktop:not(.bilateral) .header-row .title { font-size: 22px; font-weight: 700; flex: 1; }

  .scroll { flex: 1; overflow-y: auto; padding: var(--s-md); position: relative; }
  body.desktop:not(.bilateral) .scroll { padding: var(--s-lg) var(--s-xl) 60px; }

  .detalhe-grid { display: flex; flex-direction: column; }
  body.desktop:not(.bilateral) .detalhe-grid {
    display: grid; grid-template-columns: 420px 1fr; gap: var(--s-xl); align-items: start;
  }
  .col-turno { display: flex; flex-direction: column; }

  .card {
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: var(--r-md); padding: var(--s-md); margin-bottom: var(--s-md);
  }

  .funcao { font-size: 21px; font-weight: 700; margin-top: var(--s-sm); }
  .onde, .quando { color: var(--text-muted); font-size: 15px; margin-top: 3px; }
  .quem { color: var(--text-strong); font-size: 15px; margin-top: 3px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: var(--r-full); border: 1px solid; white-space: nowrap;
  }
  .badge.ativo { background: var(--success); color: #fff; border-color: var(--success); }
  .badge.aguardando { background: var(--warn-soft); color: var(--warn-ink); border-color: var(--warn-border); }

  /* ───────── Card do cronômetro (§3.1) ───────── */
  .crono-titulo {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    color: var(--text-muted);
  }
  .crono-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 auto;
    animation: pulso 2s ease-in-out infinite;
  }
  @keyframes pulso { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .crono-dot { animation: none; } }

  .crono-display {
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 40px; font-weight: 600; text-align: center; color: var(--text-strong);
    margin: var(--s-md) 0; letter-spacing: .02em;
  }
  body.desktop:not(.bilateral) .crono-display { font-size: 48px; }

  .crono-previsto {
    font-size: 13.5px; color: var(--text-muted); text-align: center; line-height: 1.6;
  }
  .crono-previsto .sep-dot { display: none; }
  body.desktop:not(.bilateral) .crono-previsto br { display: none; }
  body.desktop:not(.bilateral) .crono-previsto .sep-dot { display: inline; }

  .crono-reconectando {
    display: flex; align-items: flex-start; justify-content: center; gap: 8px;
    color: var(--warn-ink); font-size: 13.5px; font-weight: 600; line-height: 1.5;
    margin-top: var(--s-md); text-align: left;
  }
  .crono-congelado-linha {
    color: var(--text-muted); font-size: 13.5px; text-align: center; line-height: 1.5;
    margin-top: var(--s-sm);
  }

  /* Erro 1ª sincronização (§4.5) */
  .crono-erro {
    display: flex; align-items: center; gap: var(--s-sm); justify-content: space-between;
    background: var(--error-soft); border: 1px solid #e0a3a3; color: #8a2b2b;
    border-radius: var(--r-md); padding: 12px var(--s-md); font-size: 14px;
  }
  .crono-erro .retry { font-weight: 700; cursor: pointer; text-decoration: underline; color: inherit;
    white-space: nowrap; background:none; border:none; font-family:inherit; font-size:14px; min-height:44px; }

  .valor-titulo { font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-muted); }
  .valor-destaque { font-size: 30px; font-weight: 800; margin: 6px 0 4px; }
  .valor-nota { font-size: 13px; color: var(--text-muted); }
  .valor-linha { display: flex; justify-content: space-between; font-size: 15px; margin-top: 10px; }
  .valor-linha .rotulo { color: var(--text-muted); }
  .valor-linha.total { border-top: 1px solid var(--border-subtle); padding-top: 10px; margin-top: 12px;
    font-weight: 800; font-size: 17px; }
  .valor-linha.total .rotulo { color: var(--text-strong); }

  .aceite-link {
    display: flex; align-items: center; gap: var(--s-sm); min-height: 48px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; color: var(--accent-ink); padding: 0 var(--s-xs);
    margin-bottom: var(--s-sm); text-align: left;
  }
  .aceite-link .chev { margin-left: auto; color: var(--text-muted); }

  .acoes { padding: var(--s-md); }
  .acoes.placeholder { border-style: dashed; text-align: center; padding: var(--s-lg) var(--s-md); }
  .acoes .t { font-size: 15px; font-weight: 700; }
  .acoes .s { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; }

  .group-header {
    font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-muted); margin: var(--s-sm) 2px var(--s-sm);
  }
  body.desktop:not(.bilateral) .col-historico .group-header { margin-top: 0; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .tl-evento { display: flex; gap: 12px; position: relative; padding-bottom: var(--s-md); }
  .tl-rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex: 0 0 auto; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: 0 0 auto; }
  .tl-line { width: 2px; flex: 1; background: var(--border-strong); margin-top: 4px; }
  .tl-evento:last-child .tl-line { display: none; }
  .tl-titulo { font-size: 15px; font-weight: 700; }
  .tl-desc { font-size: 14px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
  .tl-quando { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  .hidden { display: none !important; }
</style>
</head>
<body class="mobile">

  <div class="proto-bar">
    <strong>SCREEN-063 · Cronômetro bilateral</strong>
    <div class="sep"></div>
    <div class="group">
      <span>Papel:</span>
      <span class="chip active" data-papel="profissional" onclick="setPapel('profissional')">Profissional</span>
      <span class="chip" data-papel="contratante" onclick="setPapel('contratante')">Contratante</span>
    </div>
    <div class="sep"></div>
    <div class="group">
      <span>Viewport:</span>
      <span class="chip active" data-vp="mobile" onclick="setVp('mobile')">Mobile</span>
      <span class="chip" data-vp="desktop" onclick="setVp('desktop')">Desktop</span>
      <span class="chip" data-vp="bilateral" onclick="setVp('bilateral')">Bilateral (2 lados, CA-3)</span>
    </div>
    <div class="sep"></div>
    <div class="group">
      <span>Estado:</span>
      <span class="chip active" data-st="rodando" onclick="setState('rodando')">Rodando</span>
      <span class="chip" data-st="turno-curto" onclick="setState('turno-curto')">Turno curto (MM:SS)</span>
      <span class="chip" data-st="sincronizando" onclick="setState('sincronizando')">Sincronizando</span>
      <span class="chip" data-st="reconectando" onclick="setState('reconectando')">Reconectando (CA-6)</span>
      <span class="chip" data-st="aguardando-checkout" onclick="setState('aguardando-checkout')">Aguardando check-out (CA-5)</span>
      <span class="chip" data-st="erro-sync" onclick="setState('erro-sync')">Erro 1ª sincronização</span>
    </div>
  </div>

  <div class="stage" id="stage"></div>

<script>
  // ---- Mock inline, sem rede. Mecanismo = ADR-017: âncora fixa + derivação local. ----
  // O "servidor" do mock fixou iniciado_em; cada frame deriva decorrido = agora − iniciado_em.
  // É exatamente por isso que o modo bilateral mostra os dois lados IDÊNTICOS (CA-3).
  let papel = 'profissional';
  let vp = 'mobile';
  let estado = 'rodando';

  // Âncoras do mock (turno longo 18:00–23:00 começou há ~2h35; curto 18:00–18:45 há ~12min)
  const agora0 = Date.now();
  const ANCORAS = {
    longo: agora0 - (2*3600 + 35*60 + 34) * 1000,
    curto: agora0 - (12*60 + 7) * 1000,
    congelado: (5*3600 + 2*60 + 13) * 1000, // duração final fixa (CA-5)
  };

  const pad = n => String(n).padStart(2, '0');
  function fmt(ms, curto) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    if (curto && h === 0) return `${pad(m)}:${pad(ss)}`;   // MM:SS; promove ao cruzar 1h
    return `${pad(h)}:${pad(m)}:${pad(ss)}`;
  }

  function frameHtml(p, rotulo) {
    const contr = p === 'contratante';
    const curto = estado === 'turno-curto';
    const congelado = estado === 'aguardando-checkout';
    const quando = curto ? 'Sex, 12/06 · 18:00–18:45' : 'Sex, 12/06 · 18:00–23:00';
    const duracao = curto ? '45min' : '5h';

    const badge = congelado
      ? '<span class="badge aguardando" data-testid="turno-detalhe-estado">● Aguardando check-out</span>'
      : '<span class="badge ativo" data-testid="turno-detalhe-estado">● Em andamento</span>';

    const valor = contr ? `
      <div class="card" data-testid="turno-detalhe-valor">
        <div class="valor-titulo">Pagamento deste turno</div>
        <div class="valor-linha"><span class="rotulo">Valor do profissional</span><span>R$ 200,00</span></div>
        <div class="valor-linha"><span class="rotulo">Taxa Turni</span><span>R$ 30,00</span></div>
        <div class="valor-linha total"><span class="rotulo">Total</span><span>R$ 230,00</span></div>
      </div>` : `
      <div class="card" data-testid="turno-detalhe-valor">
        <div class="valor-titulo">Você recebe</div>
        <div class="valor-destaque">R$ 200,00</div>
        <div class="valor-nota">valor integral · taxa Turni cobrada do contratante</div>
      </div>`;

    // ── Card do cronômetro (§3/§4) ──
    let cronoCorpo;
    if (estado === 'erro-sync') {
      cronoCorpo = `
        <div class="crono-erro" data-testid="cronometro-erro" aria-live="polite">
          <span>Não foi possível carregar o cronômetro. Verifique sua conexão.</span>
          <button class="retry" data-testid="cronometro-retry-btn" onclick="setState('rodando')">Tentar de novo</button>
        </div>`;
    } else if (congelado) {
      cronoCorpo = `
        <div class="crono-titulo">Aguardando check-out</div>
        <div class="crono-display" data-testid="cronometro-display">${fmt(ANCORAS.congelado, false)}</div>
        <div class="crono-congelado-linha" data-testid="cronometro-aguardando-checkout" aria-live="polite">
          Aguardando check-out — duração final: ${fmt(ANCORAS.congelado, false)}
        </div>`;
    } else {
      const display = estado === 'sincronizando' ? (curto ? '--:--' : '--:--:--') : '';
      cronoCorpo = `
        <div class="crono-titulo"><span class="crono-dot" aria-hidden="true"></span>Turno em andamento</div>
        <div class="crono-display js-tick" data-testid="cronometro-display" data-curto="${curto ? 1 : 0}">${display}</div>
        <div class="crono-previsto" data-testid="cronometro-previsto">
          Início previsto: 18:00<span class="sep-dot"> · </span><br />Duração prevista: ${duracao}
        </div>
        ${estado === 'reconectando' ? `
        <div class="crono-reconectando" data-testid="cronometro-reconectando" aria-live="polite">
          <span aria-hidden="true">⟳</span><span>Reconectando… O tempo continua valendo.</span>
        </div>` : ''}`;
    }

    const tl = `
      <li class="tl-evento"><span class="tl-rail" aria-hidden="true"><span class="tl-dot"></span><span class="tl-line"></span></span>
        <span><div class="tl-titulo">Check-in validado</div><div class="tl-desc">Turno iniciado.</div><div class="tl-quando">Sex, 12/06 · 18:01</div></span></li>
      <li class="tl-evento"><span class="tl-rail" aria-hidden="true"><span class="tl-dot"></span><span class="tl-line"></span></span>
        <span><div class="tl-titulo">PIN de check-in gerado</div><div class="tl-desc">Localização confirmada (a 23 m do estabelecimento).</div><div class="tl-quando">Sex, 12/06 · 17:58</div></span></li>
      <li class="tl-evento"><span class="tl-rail" aria-hidden="true"><span class="tl-dot"></span><span class="tl-line"></span></span>
        <span><div class="tl-titulo">Pagamento reservado</div><div class="tl-desc">${contr ? 'R$ 230,00 reservados no seu meio de pagamento.' : 'O contratante garantiu o pagamento deste turno.'}</div><div class="tl-quando">Qua, 03/06 · 15:47</div></span></li>
      <li class="tl-evento"><span class="tl-rail" aria-hidden="true"><span class="tl-dot"></span><span class="tl-line"></span></span>
        <span><div class="tl-titulo">Turno confirmado</div><div class="tl-desc">Candidatura aprovada.</div><div class="tl-quando">Qua, 03/06 · 15:46</div></span></li>`;

    return `
    <div>
      ${rotulo ? `<div class="frame-rotulo papel-${p}" style="color:var(--accent-ink)">${rotulo}</div>` : ''}
      <div class="frame papel-${p}" data-testid="turno-detalhe-screen">
        <div class="brand">TURN<span>I</span>.</div>
        <div class="appbar"><button class="back" aria-label="Voltar">←</button><span class="title">Detalhe do turno</span></div>
        <div class="scroll">
          <div class="header-row"><button class="back" aria-label="Voltar">←</button><span class="title">Detalhe do turno</span></div>
          <div class="detalhe-grid">
            <div class="col-turno">
              <div class="card">
                ${badge}
                <div class="funcao" data-testid="turno-detalhe-funcao">Garçom</div>
                ${contr ? '<div class="quem">Júlia Santos</div>' : ''}
                <div class="onde" data-testid="turno-detalhe-onde">Bar do Zé</div>
                <div class="quando" data-testid="turno-detalhe-quando">${quando}</div>
              </div>

              <!-- §3.1 — card do cronômetro, logo abaixo do header -->
              <div class="card" data-testid="cronometro-card">${cronoCorpo}</div>

              ${valor}

              <button class="aceite-link" data-testid="turno-detalhe-aceite-btn">
                <span aria-hidden="true">📄</span> Ver aceite eletrônico <span class="chev" aria-hidden="true">›</span>
              </button>

              <!-- Área de ações: placeholder da 060 (o check-out é a 064) -->
              <div class="card acoes placeholder" data-testid="turno-detalhe-acoes">
                <div class="t">Nenhuma ação disponível no momento</div>
                <div class="s">As ações deste turno aparecem aqui conforme ele avança.</div>
              </div>
            </div>

            <div class="col-historico">
              <h2 class="group-header" data-testid="turno-detalhe-historico-header">Histórico</h2>
              <ul class="timeline" data-testid="turno-detalhe-timeline">${tl}</ul>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function render() {
    const stage = document.getElementById('stage');
    if (vp === 'bilateral') {
      stage.innerHTML =
        frameHtml('profissional', 'Profissional — mesmo turno') +
        frameHtml('contratante', 'Contratante — mesmo turno');
    } else {
      stage.innerHTML = frameHtml(papel, null);
    }
    tick(); // primeiro frame do display sem esperar 1s
  }

  // Tick local de 1s — TODOS os displays derivam da MESMA âncora (sincronia estrutural).
  function tick() {
    if (estado === 'sincronizando' || estado === 'aguardando-checkout' || estado === 'erro-sync') return;
    const ancora = estado === 'turno-curto' ? ANCORAS.curto : ANCORAS.longo;
    document.querySelectorAll('.js-tick').forEach(el => {
      el.textContent = fmt(Date.now() - ancora, el.dataset.curto === '1');
    });
  }
  setInterval(tick, 1000);

  // ---- Controles do protótipo ----
  function setPapel(p) {
    papel = p;
    document.querySelectorAll('[data-papel]').forEach(c => c.classList.toggle('active', c.dataset.papel === p));
    render();
  }
  function setVp(v) {
    vp = v;
    document.body.classList.remove('mobile', 'desktop', 'bilateral');
    document.body.classList.add(v === 'bilateral' ? 'bilateral' : v);
    document.querySelectorAll('[data-vp]').forEach(c => c.classList.toggle('active', c.dataset.vp === v));
    render();
  }
  function setState(st) {
    estado = st;
    document.querySelectorAll('[data-st]').forEach(c => c.classList.toggle('active', c.dataset.st === st));
    render();
  }

  // init (query string: ?vp=desktop|bilateral&state=reconectando&papel=contratante)
  const qs = new URLSearchParams(location.search);
  if (['mobile','desktop','bilateral'].includes(qs.get('vp'))) vp = qs.get('vp');
  if (['contratante','profissional'].includes(qs.get('papel'))) papel = qs.get('papel');
  const st0 = qs.get('state');
  if (['rodando','turno-curto','sincronizando','reconectando','aguardando-checkout','erro-sync'].includes(st0)) estado = st0;
  document.querySelectorAll('[data-papel]').forEach(c => c.classList.toggle('active', c.dataset.papel === papel));
  document.querySelectorAll('[data-st]').forEach(c => c.classList.toggle('active', c.dataset.st === estado));
  setVp(vp);
</script>
</body>
</html>
