name: Deploy Stage

# Deploy MANUAL do ambiente stage (projeto GCP independente turni-stage).
# Disparado sob demanda (workflow_dispatch) com o ref a promover (tag/branch/sha).
# Constrói as imagens a partir do ref, empurra para o Artifact Registry do turni-stage,
# roda migração (SEM o seed de teste do homolog) e faz deploy de api/admin/pagarme-mock
# + WebApp (Firebase target stage). NÃO mexe no detect-env do release.yml (ADR-004).
#
# Secrets vêm do GitHub Environment `stage` (GCP_PROJECT_ID=turni-stage,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT). Deploy do Firebase é keyless
# (firebase CLI usa a credencial WIF como ADC).

on:
  workflow_dispatch:
    inputs:
      ref:
        # Vira a tag da imagem no Artifact Registry (:stage-<ref>) e a versão exibida —
        # use tag, sha ou branch SEM "/" (caractere inválido em tag de imagem/artefato).
        description: "Ref a construir e promover para o stage (tag, sha, ou branch sem '/')"
        required: true
        default: "main"

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  GCP_REGION: southamerica-east1

jobs:
  build:
    name: Build & push ${{ matrix.app }} → stage
    runs-on: ubuntu-latest
    environment:
      name: stage
    strategy:
      matrix:
        app: [api, admin, pagarme-mock]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build + push imagem (${{ matrix.app }})
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/${{ matrix.app }}"
          docker build \
            --file infra/docker/${{ matrix.app }}/Dockerfile.prod \
            --build-arg APP_VERSION=stage-${{ inputs.ref }} \
            --tag "${IMAGE}:stage-${{ inputs.ref }}" \
            --tag "${IMAGE}:latest" \
            --push \
            .

  build-webapp:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          cache: true
      - name: Get dependencies
        working-directory: apps/webapp
        run: flutter pub get
      - name: Gerar version.json e health.json
        run: |
          echo '{"version":"${{ inputs.ref }}"}' > apps/webapp/web/version.json
          echo '{"status":"ok","version":"${{ inputs.ref }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","service":"webapp"}' > apps/webapp/web/health.json
      - name: Build web (release)
        working-directory: apps/webapp
        run: |
          flutter build web \
            --dart-define=APP_VERSION=${{ inputs.ref }} \
            --dart-define=API_BASE_URL= \
            --dart-define=TURNI_ENV=stage \
            --no-tree-shake-icons \
            --release
      - name: Upload artefato web
        uses: actions/upload-artifact@v4
        with:
          name: webapp-web-stage-${{ inputs.ref }}
          path: apps/webapp/build/web/
          retention-days: 7

  migrate:
    name: Migrar (stage — sem seed de teste)
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: stage
    timeout-minutes: 15
    steps:
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Garantir Cloud SQL ligado
        run: |
          STATE=$(gcloud sql instances describe turni-stage \
            --project=${{ secrets.GCP_PROJECT_ID }} --format="value(state)")
          echo "estado atual: $STATE"
          if [ "$STATE" != "RUNNABLE" ]; then
            gcloud sql instances patch turni-stage \
              --project=${{ secrets.GCP_PROJECT_ID }} --activation-policy=ALWAYS --quiet
            for i in $(seq 1 30); do
              ST=$(gcloud sql instances describe turni-stage \
                --project=${{ secrets.GCP_PROJECT_ID }} --format="value(state)")
              [ "$ST" = "RUNNABLE" ] && { echo "RUNNABLE"; break; }
              echo "aguardando RUNNABLE ($i/30) — $ST"; sleep 10
            done
          fi
      - name: Deploy + executa job de migração (migrate --force, SEM seed)
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/api:stage-${{ inputs.ref }}"
          CONN="${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:turni-stage"
          gcloud run jobs deploy turni-migrate-stage \
            --image="$IMAGE" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --service-account=turni-apps@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-cloudsql-instances="$CONN" \
            --network=turni-stage --subnet=turni-stage-${{ env.GCP_REGION }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars="APP_ENV=production,APP_DEBUG=false,LOG_CHANNEL=stderr,DB_CONNECTION=pgsql,DB_SOCKET=/cloudsql/${CONN},DB_DATABASE=turni,DB_USERNAME=turni,QUEUE_CONNECTION=database,SESSION_DRIVER=array" \
            --set-secrets="APP_KEY=turni-stage-app-key-api:latest,DB_PASSWORD=turni-stage-db-password:latest,PIX_FALHA_CHAVE_KEY=turni-stage-pix-falha-chave-key:latest" \
            --command=sh \
            --args='-c,php artisan migrate --force' \
            --max-retries=0 --task-timeout=300
          gcloud run jobs execute turni-migrate-stage \
            --region=${{ env.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }} --wait
      - name: Atualizar imagem do worker + scheduler jobs
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/api:stage-${{ inputs.ref }}"
          for JOB in turni-worker-job-stage turni-scheduler-job-stage; do
            gcloud run jobs update "$JOB" \
              --image="$IMAGE" \
              --region=${{ env.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }}
          done

  deploy-api:
    name: Deploy API → stage
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment:
      name: stage
      url: https://api.stage.turni.com.br/health
    steps:
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run — api (stage)
        run: |
          gcloud run deploy turni-api-stage \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/api:stage-${{ inputs.ref }}" \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --update-env-vars "SESSION_DRIVER=database,SESSION_COOKIE=__session" \
            --quiet
      - name: Health check
        run: |
          URL=$(gcloud run services describe turni-api-stage \
            --region=${{ env.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null)
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
            if [ "$STATUS" = "200" ]; then echo "Health ok: ${URL}/health"; exit 0; fi
            echo "Aguardando... ($i/12) status=$STATUS"; sleep 10
          done
          echo "Health check falhou após 120s" && exit 1

  deploy-admin:
    name: Deploy Admin → stage
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment:
      name: stage
    steps:
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run — admin (stage)
        run: |
          gcloud run deploy turni-admin-stage \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/admin:stage-${{ inputs.ref }}" \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --ingress=all \
            --quiet

  deploy-pagarme-mock:
    name: Deploy fake Pagar.me → stage
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: stage
    steps:
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run — pagarme-mock (stage)
        run: |
          gcloud run deploy turni-pagarme-mock-stage \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/pagarme-mock:stage-${{ inputs.ref }}" \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet

  deploy-webapp:
    name: Deploy WebApp → stage (Firebase)
    runs-on: ubuntu-latest
    needs: [build-webapp]
    environment:
      name: stage
      url: https://app.stage.turni.com.br
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Download artefato web
        uses: actions/download-artifact@v4
        with:
          name: webapp-web-stage-${{ inputs.ref }}
          path: apps/webapp/build/web/
      # Keyless: firebase CLI usa a credencial WIF (ADC) do passo de auth acima.
      - name: Setup firebase-tools
        run: npm i -g firebase-tools@13.29.1
      - name: Deploy Firebase Hosting (stage)
        run: |
          firebase deploy --only hosting:stage \
            --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive \
            --message "stage-${{ inputs.ref }}"
