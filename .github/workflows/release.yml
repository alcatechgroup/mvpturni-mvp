name: Release

# Único disparador de build de release + deploy (ADR-021 / quality-standards 2.2).
#   vX.Y.Z-rc.N → build + deploy automático em homologação (sem gate humano)
#   vX.Y.Z      → build + deploy em produção (gate humano via GitHub Environment "prod")
#
# Push/merge em main sem tag NÃO dispara este workflow.
#
# O QUE MUDOU COM A ADR-021: antes eram três caminhos de entrega (Cloud Run para
# api/admin, Cloud Run Job para as migrações, Firebase Hosting para webapp e landing)
# e um workflow separado só para a landing. Agora TUDO é imagem no Artifact Registry,
# e o deploy é um único comando remoto na VPS, por SSH através do túnel IAP — sem
# porta 22 exposta e sem chave de longa duração (a credencial vem do WIF).
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*" # homolog: v0.1.0-rc.1
      - "v[0-9]*.[0-9]*.[0-9]*" # prod: v0.1.0 (detect-env distingue em runtime)

  # STAGING não tem gatilho por tag de propósito: ele é o ambiente de demonstração,
  # promovido quando alguém decide, não a cada release candidate. Este disparo manual
  # também serve para reaplicar uma tag já publicada em qualquer ambiente.
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente alvo"
        type: choice
        options: [staging, homolog, prod]
        default: staging
      tag:
        description: "Tag da release (ex.: v0.1.0-rc.3). Vira a tag da imagem e a versão exibida."
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  GCP_REGION: southamerica-east1

jobs:
  # ── Ambiente alvo, derivado da tag ─────────────────────────────────────────
  detect-env:
    name: Detectar ambiente
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      is_rc: ${{ steps.detect.outputs.is_rc }}
      instance: ${{ steps.detect.outputs.instance }}
      webapp_host: ${{ steps.detect.outputs.webapp_host }}
      admin_host: ${{ steps.detect.outputs.admin_host }}
      api_host: ${{ steps.detect.outputs.api_host }}
      landing_host: ${{ steps.detect.outputs.landing_host }}
      turni_env: ${{ steps.detect.outputs.turni_env }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - id: detect
        env:
          ENTRADA_AMBIENTE: ${{ inputs.ambiente }}
          ENTRADA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Disparo manual manda; push de tag deriva o ambiente do formato da tag.
          TAG="${ENTRADA_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          AMBIENTE="${ENTRADA_AMBIENTE:-}"
          if [ -z "$AMBIENTE" ]; then
            [[ "$TAG" =~ -rc\. ]] && AMBIENTE=homolog || AMBIENTE=prod
          fi

          if [ "$AMBIENTE" = "staging" ]; then
            {
              echo "environment=staging"
              echo "is_rc=true"
              echo "instance=turni-staging-vm"
              echo "webapp_host=app-staging.turni.com.br"
              echo "admin_host=admin-staging.turni.com.br"
              echo "api_host=api-staging.turni.com.br"
              echo "landing_host=staging.turni.com.br"
              # `homolog` é o contrato do banner "Ambiente de teste" (match exato —
              # STORY-075); staging também precisa dele.
              echo "turni_env=homolog"
            } >> "$GITHUB_OUTPUT"
          elif [ "$AMBIENTE" = "homolog" ]; then
            {
              echo "environment=homolog"
              echo "is_rc=true"
              echo "instance=turni-homolog-vm"
              echo "webapp_host=app-homolog.turni.com.br"
              echo "admin_host=admin-homolog.turni.com.br"
              echo "api_host=api-homolog.turni.com.br"
              echo "landing_host=homolog.turni.com.br"
              echo "turni_env=homolog"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "environment=prod"
              echo "is_rc=false"
              echo "instance=turni-prod-vm"
              echo "webapp_host=app.turni.com.br"
              echo "admin_host=admin.turni.com.br"
              echo "api_host=api.turni.com.br"
              echo "landing_host=turni.com.br"
              echo "turni_env=production"
            } >> "$GITHUB_OUTPUT"
          fi

  # ── Imagens que dependem só do repositório ─────────────────────────────────
  build:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [detect-env]
    # O gate do Environment `prod` cobre também o build: uma aprovação para o release
    # inteiro, em vez de uma por job.
    environment:
      name: ${{ needs.detect-env.outputs.environment }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    strategy:
      matrix:
        # pagarme-mock é o fake de pagamento (PDR-017 / ADR-016 d): a imagem é
        # construída sempre, mas só sobe onde o profile `fake` está ligado — em
        # produção o compose não a instancia.
        app: [api, admin, caddy, pagarme-mock]
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build + push (${{ matrix.app }})
        run: |
          set -euo pipefail
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/${{ matrix.app }}"
          docker build \
            --file "infra/docker/${{ matrix.app }}/Dockerfile.prod" \
            --build-arg APP_VERSION="${TAG_RELEASE}" \
            --tag "${IMAGE}:${TAG_RELEASE}" \
            --push \
            .

  # ── WebApp Flutter: build web e depois empacotamento ───────────────────────
  build-webapp:
    name: Build & push webapp
    runs-on: ubuntu-latest
    needs: [detect-env]
    environment:
      name: ${{ needs.detect-env.outputs.environment }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          cache: true

      - name: Get dependencies
        working-directory: apps/webapp
        run: flutter pub get

      - name: Garantir versão presente
        # A versão exibida no app é a tag de release. Nunca deployar sem ela.
        run: |
          test -n "${TAG_RELEASE}" || {
            echo "::error::tag vazia — abortando build sem versão."; exit 1;
          }

      - name: Gerar version.json e health.json
        run: |
          echo '{"version":"${{ needs.detect-env.outputs.tag }}"}' > apps/webapp/web/version.json
          echo '{"status":"ok","version":"${{ needs.detect-env.outputs.tag }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","service":"webapp"}' > apps/webapp/web/health.json

      - name: Setup Node (branding do PWA)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/webapp/package-lock.json

      - name: Branding do PWA por ambiente (ícone + nome)
        # Tinge o ícone e ajusta nome/theme-color conforme o ambiente (prod verde,
        # homolog azul). Roda ANTES do build; como o build é por tag, não vaza entre
        # ambientes.
        working-directory: apps/webapp
        run: |
          npm ci --no-audit --no-fund
          node scripts/brand-webapp.mjs ${{ needs.detect-env.outputs.is_rc == 'true' && 'homolog' || 'production' }}

      - name: Build web (release)
        working-directory: apps/webapp
        run: |
          # API_BASE_URL vazio = MESMA ORIGEM. O WebApp chama /api e /sanctum no
          # próprio host e o Caddy da VPS encaminha para o container da api — é o que
          # mantém o cookie de sessão do Sanctum same-site (antes, o rewrite do
          # Firebase Hosting cumpria esse papel — STORY-016).
          flutter build web \
            --dart-define=APP_VERSION=${{ needs.detect-env.outputs.tag }} \
            --dart-define=API_BASE_URL= \
            --dart-define=TURNI_ENV=${{ needs.detect-env.outputs.turni_env }} \
            --no-tree-shake-icons \
            --release

      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build + push da imagem webapp
        run: |
          set -euo pipefail
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/webapp"
          docker build \
            --file infra/docker/webapp/Dockerfile.prod \
            --build-arg APP_VERSION="${TAG_RELEASE}" \
            --tag "${IMAGE}:${TAG_RELEASE}" \
            --push \
            .

  # ── Landing institucional (gate da ADR-012 aplicado no build da imagem) ────
  build-landing:
    name: Build & push landing
    runs-on: ubuntu-latest
    needs: [detect-env]
    environment:
      name: ${{ needs.detect-env.outputs.environment }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build + push da imagem landing
        env:
          LANDING_SECRET_PATH: ${{ secrets.LANDING_SECRET_PATH }}
        run: |
          set -euo pipefail
          test -n "$LANDING_SECRET_PATH" || { echo "::error::secret LANDING_SECRET_PATH vazio"; exit 1; }
          echo "::add-mask::$LANDING_SECRET_PATH"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/turni/landing"
          # O rename de _lp/, o swap do CTA e a geração do robots.txt acontecem DENTRO
          # do Dockerfile (ADR-012 §2) — as mesmas validações de antes rodam lá.
          docker build \
            --file infra/docker/landing/Dockerfile.prod \
            --build-arg APP_VERSION="${TAG_RELEASE}" \
            --build-arg LANDING_SECRET_PATH="$LANDING_SECRET_PATH" \
            --build-arg WEBAPP_URL="https://${{ needs.detect-env.outputs.webapp_host }}" \
            --tag "${IMAGE}:${TAG_RELEASE}" \
            --push \
            .

  # ── Deploy na VPS ──────────────────────────────────────────────────────────
  # Um comando remoto. O deploy.sh na VPS faz o resto: sincroniza config, relê
  # segredos do Secret Manager, aplica migrações, sobe a stack e valida /health.
  deploy:
    name: Deploy na VPS (${{ needs.detect-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [detect-env, build, build-webapp, build-landing]
    environment:
      name: ${{ needs.detect-env.outputs.environment }}
    env:
      TAG_RELEASE: ${{ needs.detect-env.outputs.tag }}
    steps:
      - name: Autenticar no GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Backup do banco antes de migrar
        # Migração é forward-only (quality-standards 2.4): o rollback devolve o código,
        # não o schema. Este dump é a única rede de segurança para o dado se a migração
        # da release se mostrar destrutiva.
        run: |
          set -euo pipefail
          gcloud compute ssh "${{ needs.detect-env.outputs.instance }}" \
            --zone "${{ env.GCP_REGION }}-c" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --tunnel-through-iap --quiet \
            --command "sudo /opt/turni/scripts/backup.sh pre-${TAG_RELEASE}"

      - name: Aplicar a release
        run: |
          set -euo pipefail
          gcloud compute ssh "${{ needs.detect-env.outputs.instance }}" \
            --zone "${{ env.GCP_REGION }}-c" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --tunnel-through-iap --quiet \
            --command "sudo /opt/turni/scripts/deploy.sh ${TAG_RELEASE}"

  # ── Smoke pelo DNS público ─────────────────────────────────────────────────
  # Vale mais que o health interno do deploy: exercita a cadeia inteira — Cloudflare,
  # certificado do Caddy, roteamento por host e o same-origin do WebApp.
  smoke:
    name: Smoke HTTP
    runs-on: ubuntu-latest
    needs: [detect-env, deploy]
    steps:
      - name: Verificar as quatro superfícies
        env:
          WEBAPP: ${{ needs.detect-env.outputs.webapp_host }}
          ADMIN: ${{ needs.detect-env.outputs.admin_host }}
          API: ${{ needs.detect-env.outputs.api_host }}
          LANDING: ${{ needs.detect-env.outputs.landing_host }}
          TAG: ${{ needs.detect-env.outputs.tag }}
        run: |
          set -uo pipefail
          fail=0

          check() {
            local nome="$1" url="$2" esperado="$3"
            local code
            code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$url" || echo "000")
            if [ "$code" = "$esperado" ]; then
              echo "ok   $nome ($code) — $url"
            else
              echo "FALHA $nome: esperado $esperado, veio $code — $url"
              fail=1
            fi
          }

          check "webapp"          "https://$WEBAPP/"        200
          check "webapp /health"  "https://$WEBAPP/health"  200
          check "api /health"     "https://$API/health"     200
          check "admin"           "https://$ADMIN/"         200
          check "landing"         "https://$LANDING/"       200

          # A versão publicada tem que ser a da tag. Sem esta asserção, um deploy que
          # falhou em trocar a imagem passaria despercebido: tudo responde 200, só que
          # é a release anterior.
          versao=$(curl -sSL --max-time 20 "https://$WEBAPP/version.json" | tr -d ' \n')
          if echo "$versao" | grep -q "\"$TAG\""; then
            echo "ok   versão publicada = $TAG"
          else
            echo "FALHA versão publicada: esperado $TAG, veio $versao"
            fail=1
          fi

          exit $fail
