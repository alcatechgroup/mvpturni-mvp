# Servidor estático do WebApp Flutter — porta as regras que viviam no firebase.json
# (ADR-021). O que este arquivo garante, em ordem de importância:
#
#   1. O APP CONSEGUE ATUALIZAR. A cadeia de entrada do Flutter tem nomes FIXOS, sem
#      hash de conteúdo (index.html → flutter_bootstrap.js → main.dart.js, mais o
#      flutter_service_worker.js). Servi-los como `immutable` os fixa no aparelho por
#      um ano e o app NUNCA mais atualiza, nem com reload — causa-raiz confirmada em
#      homolog na STORY-037. Por isso: no-cache neles, immutable só no que tem hash.
#   2. Rota de SPA: qualquer caminho desconhecido devolve o index.html.
#   3. /health responde JSON (usado pelo smoke do pipeline e pelo uptime check).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # O Caddy à frente já comprime; comprimir de novo só gasta CPU do e2-small.
    gzip off;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"severity":"INFO",'
        '"service":"webapp",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status_code":$status,'
        '"duration_ms":$request_time,'
        '"bytes_sent":$bytes_sent}';
    access_log /dev/stdout json_combined;

    # Wasm não está no mime.types de todas as versões; sem isto o CanvasKit chega
    # como octet-stream e o navegador recusa a instanciação em streaming.
    types {
        application/wasm wasm;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;

        # ── Nunca cachear: ponto de entrada e metadados de versão ─────────────
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /health.json {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /health {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files /health.json =404;
        }

        # ── Cadeia de entrada do Flutter: nomes fixos, sem hash (STORY-037) ───
        location ~ ^/(main\.dart|flutter|flutter_bootstrap|flutter_service_worker)\.js$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ── Assets com hash no nome: seguros para cache longo ─────────────────
        location ~* \.(js|css|wasm|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|avif)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ── Rota de SPA ───────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
