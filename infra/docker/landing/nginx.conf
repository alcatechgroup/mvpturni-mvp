# Servidor estático da landing institucional (ADR-012).
#
# Comportamento herdado do Firebase Hosting: apex serve a página "Em breve", o path
# secreto serve a landing AS IS, e qualquer outra rota cai no 404 institucional —
# não no index. Cair no index faria toda URL inventada parecer uma página válida.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip off; # o Caddy à frente já comprime

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"severity":"INFO",'
        '"service":"landing",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status_code":$status,'
        '"duration_ms":$request_time}';
    access_log /dev/stdout json_combined;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=300" always;
        }

        # A landing AS IS é conteúdo do marketing, atualizado sem coordenação com o
        # deploy do produto: cache curto para uma correção de copy aparecer no mesmo dia.
        location ~* \.(png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf)$ {
            add_header Cache-Control "public, max-age=86400" always;
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600" always;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
