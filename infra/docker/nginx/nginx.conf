worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Uploads multipart: foto do pré-cadastro (≤5 MB, STORY-017) e documentos
    # comprobatórios (≤10 MB/arquivo, STORY-023 CA-5). O nginx default (1 MB) rejeitaria
    # com 413 antes do Laravel. Mantenha ≥ o post_max_size do PHP (30M).
    client_max_body_size 30m;

    # Logs JSON estruturados (ADR-008).
    # `trace` (ADR-008 §f / STORY-068 F-NB-2): correlaciona o access log com as linhas
    # da app. Fora do Cloud Run não existe X-Cloud-Trace-Context; o identificador de
    # request passa a ser o CF-Ray, que a Cloudflare injeta em toda requisição que
    # atravessa o proxy — único por request e visível também no painel dela.
    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"severity":"INFO",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status_code":$status,'
        '"duration_ms":$request_time,'
        '"bytes_sent":$bytes_sent,'
        '"request_id":"$http_x_request_id",'
        '"trace":"$http_cf_ray"}';
    access_log /dev/stdout json_combined;

    server {
        listen 8080;
        root /app/public;
        index index.php;

        # O Caddy é o único caminho de entrada e já resolveu o IP real do visitante
        # (CF-Connecting-IP) antes de repassar em X-Forwarded-For.
        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include       fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
